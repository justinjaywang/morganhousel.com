---
layout: page
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add("js")</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/styles/main.css' | relative_url }}">
</head>
<body>
  <main>
    <div class="copy">
      {% capture copy %}{% include copy.md %}{% endcapture %}
      {% assign copy = copy | replace_first: "Morgan Housel", '<span class="c2sc">Morgan Housel</span>' %}
      {{ copy | markdownify | replace: '<a href="http', '<a target="_blank" rel="noopener noreferrer" href="http' }}
    </div>

    <div class="books">
      {% for image in site.data.images %}
      <figure>
        <a href="{{ image.url }}"{% if image.url contains '://' %} target="_blank" rel="noopener noreferrer"{% endif %}>
          <img src="{{ image.src | relative_url }}" alt="{{ image.alt | escape }}" width="{{ image.width }}" height="{{ image.height }}" decoding="async">
          <span class="scrim" aria-hidden="true"></span>
        </a>
      </figure>
      {% endfor %}
    </div>
  </main>
  <script>
    (function () {
      /* 0.16s at 4em wide. Elsewhere, halfway between that fixed time and a steady speed. */
      var base = 0.16;
      function widest(link) {
        var rects = link.getClientRects();
        var width = 0;
        for (var i = 0; i < rects.length; i++) {
          if (rects[i].width > width) width = rects[i].width;
        }
        return width;
      }
      function timeLinks() {
        var links = document.querySelectorAll(".copy a");
        if (!links.length) return;
        var em = parseFloat(getComputedStyle(links[0]).fontSize);
        var reference = 4 * em;
        for (var i = 0; i < links.length; i++) {
          var width = widest(links[i]);
          var seconds = base * (width + reference) / (2 * reference);
          links[i].style.setProperty("--link-time", seconds.toFixed(3) + "s");
        }
      }
      timeLinks();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(timeLinks);
      window.addEventListener("resize", timeLinks);
    })();
    (function () {
      /* Hold each cover until it has decoded, then let the fade run.
         Two frames so a cached file still transitions instead of appearing painted. */
      var imgs = document.querySelectorAll(".books img");
      function show(link) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            link.classList.add("is-loaded");
          });
        });
      }
      function watch(img) {
        var link = img.closest("a");
        if (!link) return;
        function decoded() {
          if (img.decode) img.decode().catch(function () {}).then(function () { show(link); });
          else show(link);
        }
        if (img.complete) {
          if (img.naturalWidth) decoded();
          else show(link);
        } else {
          img.addEventListener("load", decoded, { once: true });
          img.addEventListener("error", function () { show(link); }, { once: true });
        }
      }
      for (var i = 0; i < imgs.length; i++) watch(imgs[i]);
    })();
  </script>
</body>
</html>
