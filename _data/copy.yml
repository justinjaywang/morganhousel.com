# Words on the page. *asterisks* are italics. [Label](https://example.com) is a link.

paragraphs:
  - >
    Morgan Housel is the New York Times Bestselling author of *The Psychology of Money*,
    *The Art of Spending Money*, and *Same As Ever*. His books have sold over 13 million
    copies and have been translated into more than 60 languages.
  - >
    He is a two-time winner of the Best in Business Award from the Society of American
    Business Editors and Writers, and winner of the New York Times Sidney Award.
    MarketWatch named him one of the 50 most influential people in markets. He's a
    partner at [The Collaborative Fund](http://www.collaborativefund.com/blog/) and
    serves on the board of directors at [Markel](https://www.markel.com/markel-corporation).

